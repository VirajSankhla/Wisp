name: Build Wisp installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/prepare-native-dist.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: native-dist
          path: native-dist

  windows-exe:
    needs: web
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-dist
          path: native-dist
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_PREPARE: "1"
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('native-{0}', github.run_number) }}
          releaseName: "Wisp ${{ github.ref_type == 'tag' && github.ref_name || format('build {0}', github.run_number) }}"
          releaseBody: |
            Personal installers. No account, no store.

            - Windows: run the `.exe`
            - Android: enable Install unknown apps, then open the `.apk`
            - iPhone: still Safari → Add to Home Screen (Apple does not allow a free public `.ipa`)
          releaseDraft: false
          prerelease: ${{ github.ref_type != 'tag' }}
          args: --bundles nsis

  android-apk:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-dist
          path: native-dist
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Use runner Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
      - name: Install stable debug signing key
        run: |
          mkdir -p "$HOME/.android"
          cp .github/keystores/debug.keystore "$HOME/.android/debug.keystore"
      - run: npm ci
      - run: npx cap add android
      - run: npx cap sync android
      - run: node scripts/sync-android-icons.mjs
      - name: Assemble debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wisp.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('native-{0}', github.run_number) }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
