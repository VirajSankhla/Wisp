[package]
name = "wisp"
version = "0.1.0"
description = "Heading-first notes at the edge of the screen"
authors = ["Viraj Sankhla"]
edition = "2021"

[lib]
name = "wisp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
